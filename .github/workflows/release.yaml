# **本仓库唯一的自动化入口**：只由 `v*.*.*` tag 触发。
#
#   1) checks —— 复用 ci.yaml（前端 typecheck/build/类型对拍 + src-tauri fmt/clippy/test + 两条断言）
#   2) build  —— 四个 target 出安装包，每个都先取 core 二进制并**校验 sha256**
#   3) verify —— 断言 release 里没有更新产物（桌面端不做自更新）
#
# 没有 push / pull_request / workflow_dispatch 入口：检查发生在发版那一刻。
# 失败时**不要移动 tag** —— 修好之后从 Actions 页面重跑失败的 job 即可。
# ⚠️ 例外：如果失败的原因是**这个文件本身**要改（例如 runner 标签失效、action 版本要动），
#    重跑用的是 tag 上那份旧 workflow，改了也生效不了 —— 那种情况只能打新 tag
#    （或 force-push 同名 tag，但那是改写已发布的历史）。
#
# ⚠️ 除注释外**不要写中文**（含 job/step 的 name 与 echo 文案）。
# ⚠️ name 里不要出现 `#`：GitHub 会把它当注释，后面的字就没了
#    （踩过：`断言「没有 updater 相关依赖与配置」（验收 #8 / #11）` 只显示到「验收」）。
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  checks:
    name: pre-release checks
    uses: ./.github/workflows/ci.yaml

  build:
    name: bundle (${{ matrix.target }})
    needs: [checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # 早失败：别等到打完包才发现 tag 与版本号不一致
      - name: tag must match package.json
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$version"
          [ "$tag" = "$version" ] || { echo "::error::tag does not match package.json"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                                  librsvg2-dev patchelf libxslt1.1

      # 版本由 package.json 的 packageManager 决定（别在这里写死，两处会漂）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 取 core 二进制：下载 + **校验 sha256** + 重命名成 Tauri 要的名字。
      # ⚠️ 这一步是供应链上最便宜的一道闸：安装包里的核心二进制被换掉 = 后门。
      - name: fetch and verify the core binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-sidecar.sh "" "${{ matrix.target }}"

      - name: assert the sidecar is present
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=".exe" ;; esac
          # 失败时先把这个目录真实的内容打出来 —— 只报一句 "No such file" 查不出原因
          if [ ! -f "src-tauri/binaries/burrow-${{ matrix.target }}${suffix}" ]; then
            echo "::group::src-tauri/binaries"
            ls -la src-tauri/binaries 2>&1 || echo "(the directory does not exist)"
            echo "::endgroup::"
            echo "::error::the sidecar for ${{ matrix.target }} is missing"
            exit 1
          fi
          ls -l "src-tauri/binaries/burrow-${{ matrix.target }}${suffix}"

      # ⚠️ 不设 updater 相关的两样东西（桌面端不做自更新，需求 G7）：
      #    它们只会制造「为什么 release 里有 latest.json / .sig」的困惑，而且
      #    `verify-no-updater-artifacts` 那步会因此红。注意 v1.0.0 的默认值是 **true**
      #    （旧版输入名叫 `includeUpdaterJson`，写它没用）。
      # ⚠️ `tauriScript` 是「怎么调用 tauri CLI」，不是「用哪个包管理器」：
      #    它按 `<tauriScript> build <args>` 拼命令，所以写 `pnpm` 会变成 `pnpm build --target …`
      #    —— `--target` 落到前端 vite 上，直接 `Invalid target 'x86_64-…'`。
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          tauriScript: pnpm tauri
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: --target ${{ matrix.target }}

      - name: note the bundled core version in the job summary
        shell: bash
        run: |
          set -euo pipefail
          core="$(grep -E '^[[:space:]]*version[[:space:]]*=' bundle.toml | head -1 \
            | sed -E 's/^[^=]*=[[:space:]]*"([^"]*)".*$/\1/')"
          echo "This installer bundles core $core" >> "$GITHUB_STEP_SUMMARY"

  verify-no-updater-artifacts:
    name: verify there are no updater artifacts
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: the release must not contain .sig or latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ⚠️ 必须显式给 `--repo`：这个 job **没有 checkout**，工作目录里没有 `.git`，
          #    而 `gh` 默认要从本地 git remote 推断仓库 —— 否则直接
          #    「failed to run git: fatal: not a git repository」。
          files="$(gh release view "$GITHUB_REF_NAME" --repo "${{ github.repository }}" \
            --json assets -q '.assets[].name')"
          echo "$files"
          if echo "$files" | grep -Eq '\.sig$|latest\.json$'; then
            echo "::error::no self-update on desktop: the release must not contain .sig or latest.json"
            exit 1
          fi
          echo "no updater artifacts"
