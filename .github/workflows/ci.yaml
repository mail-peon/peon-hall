# 被 release.yaml 调用的**可复用工作流**（`workflow_call`）。
#
# ⚠️ 这里刻意**没有** push / pull_request 触发：本仓库只有一个自动化入口
# —— `.github/workflows/release.yaml`（只吃 `v*.*.*` tag）。
# 也就是说：检查发生在发版那一刻，而不是每次推送。
#
# ⚠️ 除注释外**不要写中文**（含 job/step 的 name 与 echo 文案）：CI 日志保持英文。
name: ci

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (typecheck, build, type mirror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ⚠️ CI 只 checkout 本仓库：指向兄弟仓库的 path 依赖（`../../peon-burrow/...`）在 runner 上
      #    不存在，会让这个 job（以及 4 个 bundle job）在解析依赖时就红。
      #    本地看不出来 —— 兄弟仓库就在旁边。
      - name: no sibling path dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'path[[:space:]]*=[[:space:]]*"\.\./\.\.' src-tauri/Cargo.toml; then
            echo "::error::src-tauri/Cargo.toml points at a sibling checkout; depend on the published crate instead"
            exit 1
          fi
          echo "no sibling path dependencies"

      # 版本由 package.json 的 packageManager 决定（别在这里写死，两处会漂）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Rust 改了字段名时前端不会编译报错，靠这一步挡住（ADR-1001 Q2）
      - run: node scripts/check-types.mjs

      # ⚠️ bundle.toml 是人手维护的（core 发版后要改），写错时**第一个 bundle job 才会红**
      #    —— 这里提前验：那个 tag 的资产真的能下载。
      #    真机踩过：core 版本曾停在 `v0.0.0`，而 core 的 tag 从 `v0.0.1` 才开始（等于必红）。
      - name: the pinned core version must be downloadable
        shell: bash
        run: |
          set -euo pipefail
          # bundle.toml 是**扁平**的（见文件顶部说明）：用与 scripts/fetch-sidecar.sh
          # 相同的 grep + sed 规则读它，不引 TOML 解析器。
          read_config() {
            grep -E "^[[:space:]]*$1[[:space:]]*=" bundle.toml | head -1 \
              | sed -E 's/^[^=]*=[[:space:]]*"([^"]*)".*$/\1/'
          }
          core="$(read_config version)"
          repo="$(read_config repo)"
          [ -n "$core" ] && [ -n "$repo" ] || {
            echo "::error::bundle.toml has no core.version / core.repo"; exit 1; }
          echo "bundle.toml: core=$core repo=$repo"
          base="https://github.com/$repo/releases/download/$core"
          # 只探 fetch-sidecar.sh 真正要用的三个：归档、它的单文件校验和、以及 core 自更新的清单
          for name in \
            peon-burrow-x86_64-unknown-linux-gnu.tar.gz \
            peon-burrow-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            latest.json; do
            curl -fsSLI "$base/$name" > /dev/null
            echo "  ok $name"
          done
          echo "$core has the assets the bundler needs"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

      - name: workflow hygiene (english outside comments, no hash in names)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # 规则一：除注释外不许有中文（整行注释与行尾注释都不算代码）
          # 规则二：name 里不能有 `#` —— GitHub 会把它当注释，后面的字直接消失
          for file in .github/workflows/*.yaml .github/workflows/*.yml; do
            [ -f "$file" ] || continue

            if sed -E 's/[[:space:]]+#.*$//' "$file" \
               | grep -vE '^[[:space:]]*#' \
               | grep -qP '[\x{4e00}-\x{9fff}]'; then
              echo "::error::$file contains CJK outside comments; keep CI logs in english"
              sed -E 's/[[:space:]]+#.*$//' "$file" | grep -vE '^[[:space:]]*#' | grep -nP '[\x{4e00}-\x{9fff}]'
              fail=1
            fi

            if grep -nE '^[[:space:]]*(-[[:space:]]*)?name:.*#' "$file" > /dev/null; then
              echo "::error::$file has '#' inside a name: (GitHub treats it as a comment and truncates it)"
              grep -nE '^[[:space:]]*(-[[:space:]]*)?name:.*#' "$file"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "workflow files look good"

  rust:
    name: src-tauri (fmt, clippy, test)
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 同 frontend job 的那条：CI 上没有兄弟仓库，path 依赖会让 clippy/test 直接红
      - name: no sibling path dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'path[[:space:]]*=[[:space:]]*"\.\./\.\.' src-tauri/Cargo.toml; then
            echo "::error::src-tauri/Cargo.toml points at a sibling checkout; depend on the published crate instead"
            exit 1
          fi
          echo "no sibling path dependencies"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # `tauri::generate_context!()` 在编译期就要把前端产物嵌进去，所以先拿 dist
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # ⚠️ 编译只需要「有个同名的文件」；**真正的 sidecar 由 release.yaml
      # 从 core release 下载并校验 sha256**（见 ai-docs/03-build-and-sidecar.md § 2.1）。
      # 这里放占位文件是为了让检查不必依赖 core 已经发版。
      - name: drop a placeholder sidecar (compile only)
        run: |
          mkdir -p src-tauri/binaries
          : > "src-tauri/binaries/burrow-$(rustc --print host-tuple)"

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                                  librsvg2-dev patchelf libxslt1.1

      - name: fmt
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: assert there is no updater dependency or config
        run: |
          set -euo pipefail
          # ⚠️ 要排除 `"createUpdaterArtifacts": false` —— 那是**关掉**更新产物（与这条断言
          # 同一个目的），而它是唯一一处合法出现 "updater" 的地方。不过滤的话这条守卫
          # 一直是红的（CI 只在打 tag 时跑，所以漂了很久没人发现）。
          if grep -riE 'updater' src-tauri/Cargo.toml src-tauri/tauri.conf.json src/ 2>/dev/null \
             | grep -vE '"createUpdaterArtifacts"[[:space:]]*:[[:space:]]*false'; then
            echo "::error::the desktop app has no self-update: an updater reference was found"
            exit 1
          fi
          echo "no updater dependency or config"

      - name: assert the version matches in all three files
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_ver=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo_ver"
          [ "$pkg" = "$conf" ] && [ "$pkg" = "$cargo_ver" ] || {
            echo "::error::version mismatch (package.json is the single source; use pnpm release)"; exit 1; }
