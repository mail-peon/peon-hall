name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端（typecheck + build + 类型对拍）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Rust 改了字段名时前端不会编译报错，靠这一步挡住（ADR-1001 Q2）
      - run: node scripts/check-types.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  rust:
    name: src-tauri（fmt + clippy + test）
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # `tauri::generate_context!()` 在编译期就要把前端产物嵌进去，所以先拿 dist
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # ⚠️ 编译只需要「有个同名的文件」；**真正的 sidecar 由 release 工作流
      # 从 core release 下载并校验 sha256**（见 ai-docs/03-build-and-sidecar.md § 2.1）。
      # 这里放占位文件是为了让 CI 不必依赖 core 已经发版。
      - name: 放一个占位 sidecar（仅为通过编译）
        run: |
          mkdir -p src-tauri/binaries
          : > "src-tauri/binaries/burrow-$(rustc --print host-tuple)"

      - name: Linux 系统依赖（WebKitGTK 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                                  librsvg2-dev patchelf libxslt1.1

      - name: fmt
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 断言「没有 updater 相关依赖与配置」（验收 #8 / #11）
        run: |
          set -euo pipefail
          if grep -riE 'updater' src-tauri/Cargo.toml src-tauri/tauri.conf.json src/ 2>/dev/null; then
            echo "::error::桌面端不做自更新：出现了 updater 相关的东西"
            exit 1
          fi
          echo "没有 updater 依赖与配置 ✅"

      - name: 断言版本号三处一致
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_ver=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo_ver"
          [ "$pkg" = "$conf" ] && [ "$pkg" = "$cargo_ver" ] || {
            echo "::error::版本号不一致（唯一来源是 package.json，用 pnpm version:bump 改）"; exit 1; }
