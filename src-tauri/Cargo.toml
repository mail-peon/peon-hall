[package]
name = "peon-hall"
version = "0.1.8"
description = "peon-burrow 中继的桌面安装器与状态面板"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mail-peon/peon-hall"

[lib]
name = "peon_hall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# `build.rs` 用它解析仓库根的 `bundle.toml`（core 版本注入；版本与下面的普通依赖一致）
toml = "0.8"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# 控制面协议的**唯一实现**（见 ai-docs/02-core-integration.md § 1）。
#
# ⚠️ 这里必须是**发布版本**（crates.io），**不能是 path 依赖**：
#    CI 只 checkout 本仓库，`../../peon-burrow/...` 在 runner 上不存在 ——
#    提交 path 依赖会让 rust job 与 4 个 bundle job 在解析依赖时就红
#    （本地看不出来，因为兄弟仓库就在旁边）。
#    `ci.yaml` 的 `no path dependencies` 那一步在挡它。
#
# 本地想「改 core 立刻生效」：临时把下面两行改成 path（改完**别提交**），
# 或者用 `git update-index --skip-worktree` 之外的办法 —— 但别提交 path。
peon-burrow-ipc = "0.1.1"
peon-burrow-ipc-types = "0.1.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
